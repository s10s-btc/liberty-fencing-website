<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liberty Fencing — Admin Dashboard</title>
<style>
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #f4a818; --accent-dark: #d48f0e; --green: #3fb950; --red: #f85149; --blue: #58a6ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── LOGIN SCREEN ── */
  .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 360px; max-width: 90vw; text-align: center; }
  .login-box h1 { color: var(--accent); margin-bottom: 8px; font-size: 22px; }
  .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .app-wrap { display: none; }
  .app-wrap.unlocked { display: block; }

  /* ── NAV ── */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 24px; position: sticky; top: 0; z-index: 100; }
  .topbar h1 { font-size: 18px; color: var(--accent); white-space: nowrap; }
  .topbar nav { display: flex; gap: 4px; }
  .topbar nav button { background: none; border: 1px solid transparent; color: var(--muted); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: .15s; }
  .topbar nav button:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .topbar nav button.active { color: var(--accent); border-color: var(--accent); background: rgba(244,168,24,.08); }
  .login-bar { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .login-bar input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; width: 260px; font-size: 14px; }
  .login-bar button { background: var(--accent); color: #000; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }

  /* ── LAYOUT ── */
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .page { display: none; }
  .page.active { display: block; }

  /* ── CARDS ── */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .stat-card .label { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .stat-card .value { font-size: 28px; font-weight: 700; color: var(--accent); }

  /* ── TABLE ── */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-new { background: #0d419d; color: var(--blue); }
  .badge-contacted { background: #1a1a00; color: #e3b341; }
  .badge-won { background: #062d1e; color: var(--green); }
  .badge-lost { background: #2d0f0e; color: var(--red); }
  .link { color: var(--blue); text-decoration: none; }
  .link:hover { text-decoration: underline; }

  /* ── PRODUCTS ── */
  .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
  .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; position: relative; }
  .product-card .color-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 8px; border: 1px solid rgba(255,255,255,.15); }
  .product-card h3 { font-size: 16px; margin-bottom: 8px; }
  .product-card .meta { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .product-card .price { font-size: 22px; font-weight: 700; color: var(--green); }
  .product-card .actions { margin-top: 12px; display: flex; gap: 8px; }
  .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; transition: .15s; }
  .btn:hover { background: rgba(255,255,255,.08); }
  .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-danger { color: var(--red); border-color: var(--red); }
  .btn-danger:hover { background: rgba(248,81,73,.1); }
  .add-btn { margin-bottom: 16px; }

  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 420px; max-width: 90vw; }
  .modal h2 { font-size: 18px; margin-bottom: 16px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .form-row input, .form-row select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; }
  .form-row input[type="color"] { height: 38px; padding: 4px; cursor: pointer; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
  .empty h3 { margin-bottom: 8px; color: var(--text); }

  /* ── LOADING ── */
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-state { text-align: center; padding: 48px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .topbar { flex-wrap: wrap; gap: 12px; padding: 12px 16px; }
    .login-bar { margin-left: 0; width: 100%; }
    .login-bar input { flex: 1; }
    .container { padding: 16px; }
    .stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- ════════ ACCESS DENIED SCREEN ════════ -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>Liberty Fencing</h1>
    <p>You need an access link to view this page.</p>
  </div>
</div>

<!-- ════════ APP (hidden until login) ════════ -->
<div class="app-wrap" id="app-wrap">
<div class="topbar">
  <h1>Liberty Fencing</h1>
  <nav>
    <button class="active" data-page="leads">Leads</button>
    <button data-page="products">Products</button>
  </nav>
</div>

<!-- ════════ LEADS PAGE ════════ -->
<div class="container">
<div class="page active" id="page-leads">
  <div class="stats" id="lead-stats"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Service</th><th>Value</th><th>Status</th><th>Design</th></tr>
      </thead>
      <tbody id="leads-body">
        <tr><td colspan="8" class="loading-state"><div class="spinner"></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ════════ PRODUCTS PAGE ════════ -->
<div class="page" id="page-products">
  <button class="btn btn-primary add-btn" onclick="openProductModal()">+ Add Product</button>
  <div class="product-grid" id="products-grid">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>
</div>
</div>

<!-- ════════ PRODUCT MODAL ════════ -->
<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <h2 id="modal-title">Add Product</h2>
    <input type="hidden" id="p-id" />
    <div class="form-row">
      <label>Label (display name)</label>
      <input type="text" id="p-label" placeholder="e.g. Wood (Treated Pine)" />
    </div>
    <div class="form-row">
      <label>Type key (no spaces)</label>
      <input type="text" id="p-type" placeholder="e.g. wood_pine" />
    </div>
    <div class="form-row">
      <label>Category</label>
      <select id="p-category">
        <option value="fence">Fence (per foot)</option>
        <option value="gate">Gate (flat price)</option>
      </select>
    </div>
    <div class="form-row">
      <label id="price-label">Price per foot ($)</label>
      <input type="number" id="p-price" min="0" step="1" />
    </div>
    <div class="form-row">
      <label>Map color</label>
      <input type="color" id="p-color" value="#333333" />
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeProductModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>

</div><!-- /app-wrap -->

<script>
// ── MAGIC LINK AUTH ──
const VALID_KEY = "c852cc6a8839da25add9c8a0";

function getKey() {
  const params = new URLSearchParams(window.location.search);
  return params.get("key") || "";
}

// ── STATE ──
const API = "https://script.google.com/macros/s/AKfycbyZq7_Bf4UFkBo9DHq6-gvr85N7Z-cX_fAT9KJujDpM8Rl6Ir9KfoQx_543Fyx9-vo/exec";
let leads = [];
let products = [];

function unlock() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-wrap").classList.add("unlocked");
  loadAll();
}

if (getKey() === VALID_KEY) {
  unlock();
}


// ── NAV ──
document.querySelectorAll(".topbar nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".topbar nav button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById("page-" + btn.dataset.page).classList.add("active");
  });
});

// ── API ──
async function apiFetch(action) {
  if (!API) return null;
  try {
    // Google Apps Script redirects to googleusercontent.com — fetch follows it fine for GET
    const r = await fetch(API + "?action=" + action);
    return await r.json();
  } catch (e) {
    console.error("apiFetch error:", action, e);
    return null;
  }
}

async function apiPost(action, body) {
  if (!API) return null;
  try {
    // POST to Apps Script — use no-cors to avoid preflight CORS block
    await fetch(API + "?action=" + action, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(body)
    });
    return { success: true };
  } catch (e) {
    console.error("apiPost error:", action, e);
    return null;
  }
}

async function loadAll() {
  loadLeads();
  loadProducts();
}

// ── LEADS ──
async function loadLeads() {
  const data = await apiFetch("leads");
  if (!data) {
    document.getElementById("leads-body").innerHTML = '<tr><td colspan="8" class="empty"><h3>Not connected</h3><p>Paste your Apps Script URL above</p></td></tr>';
    return;
  }
  leads = data.leads || [];
  renderLeadStats();
  renderLeads();
}

function renderLeadStats() {
  const total = leads.length;
  const newCount = leads.filter(l => (l.Status || "New") === "New").length;
  const totalValue = leads.reduce((s, l) => s + (Number(l["Estimated Value"]) || 0), 0);
  document.getElementById("lead-stats").innerHTML = `
    <div class="stat-card"><div class="label">Total Leads</div><div class="value">${total}</div></div>
    <div class="stat-card"><div class="label">New / Uncontacted</div><div class="value">${newCount}</div></div>
    <div class="stat-card"><div class="label">Total Pipeline Value</div><div class="value">$${totalValue.toLocaleString()}</div></div>
  `;
}

function renderLeads() {
  if (leads.length === 0) {
    document.getElementById("leads-body").innerHTML = '<tr><td colspan="8" class="empty"><h3>No leads yet</h3><p>Leads from the fence designer will appear here</p></td></tr>';
    return;
  }
  document.getElementById("leads-body").innerHTML = leads.map(l => {
    const status = l.Status || "New";
    const badgeClass = "badge-" + status.toLowerCase().replace(/[^a-z]/g, "");
    const designLink = l["Design URL"] ? '<a class="link" href="' + l["Design URL"] + '" target="_blank">View</a>' : '-';
    const value = l["Estimated Value"] ? "$" + Number(l["Estimated Value"]).toLocaleString() : "-";
    return `<tr>
      <td style="white-space:nowrap">${l.Date || ""}</td>
      <td><strong>${l.Name || ""}</strong></td>
      <td><a class="link" href="tel:${l.Phone || ""}">${l.Phone || ""}</a></td>
      <td>${l.Email || ""}</td>
      <td>${l.Service || ""}</td>
      <td>${value}</td>
      <td><span class="badge ${badgeClass}">${status}</span></td>
      <td>${designLink}</td>
    </tr>`;
  }).join("");
}

// ── PRODUCTS ──
async function loadProducts() {
  const data = await apiFetch("products");
  if (!data) return;
  products = data.products || [];
  renderProducts();
}

function renderProducts() {
  const grid = document.getElementById("products-grid");
  if (products.length === 0) {
    grid.innerHTML = '<div class="empty"><h3>No products</h3><p>Add your fence types and gates</p></div>';
    return;
  }
  grid.innerHTML = products.map(p => {
    const priceLabel = p.Category === "gate" ? "$" + Number(p["Price Per Ft"]).toLocaleString() + " flat" : "$" + p["Price Per Ft"] + "/ft";
    return `<div class="product-card">
      <h3><span class="color-dot" style="background:${p.Color}"></span>${p.Label}</h3>
      <div class="meta">${p.Type} &middot; ${p.Category}</div>
      <div class="price">${priceLabel}</div>
      <div class="actions">
        <button class="btn" onclick='editProduct(${JSON.stringify(JSON.stringify(p))})'>Edit</button>
        <button class="btn btn-danger" onclick='deleteProduct("${p.ID}")'>Delete</button>
      </div>
    </div>`;
  }).join("");
}

function openProductModal(product) {
  document.getElementById("modal-title").textContent = product ? "Edit Product" : "Add Product";
  document.getElementById("p-id").value = product ? product.ID : "";
  document.getElementById("p-label").value = product ? product.Label : "";
  document.getElementById("p-type").value = product ? product.Type : "";
  document.getElementById("p-category").value = product ? product.Category : "fence";
  document.getElementById("p-price").value = product ? product["Price Per Ft"] : "";
  document.getElementById("p-color").value = product ? product.Color : "#333333";
  updatePriceLabel();
  document.getElementById("product-modal").classList.add("open");
}

function closeProductModal() {
  document.getElementById("product-modal").classList.remove("open");
}

function updatePriceLabel() {
  document.getElementById("price-label").textContent =
    document.getElementById("p-category").value === "gate" ? "Price (flat $)" : "Price per foot ($)";
}
document.getElementById("p-category").addEventListener("change", updatePriceLabel);

function editProduct(jsonStr) {
  openProductModal(JSON.parse(jsonStr));
}

async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;
  await apiPost("deleteProduct", { id: id });
  loadProducts();
}

async function saveProduct() {
  const payload = {
    id: document.getElementById("p-id").value || null,
    type: document.getElementById("p-type").value.trim(),
    label: document.getElementById("p-label").value.trim(),
    pricePerFt: Number(document.getElementById("p-price").value) || 0,
    color: document.getElementById("p-color").value,
    category: document.getElementById("p-category").value
  };
  if (!payload.label || !payload.type) { alert("Label and type are required"); return; }
  await apiPost("saveProduct", payload);
  closeProductModal();
  loadProducts();
}

// Close modal on backdrop click
document.getElementById("product-modal").addEventListener("click", function(e) {
  if (e.target === this) closeProductModal();
});
</script>
</body>
</html>
